const LG=[...rows("Brazil:Portuguese;Japan:Japanese;Egypt:Arabic;Iran:Persian (Farsi);Germany:German;Russia:Russian;Italy:Italian;Thailand:Thai;Argentina:Spanish;South Korea:Korean;Türkiye:Turkish;Greece:Greek;Vietnam:Vietnamese",1),...rows("Angola:Portuguese;Mozambique:Portuguese;Senegal:French;Mali:French;Netherlands:Dutch;Poland:Polish;Hungary:Hungarian;Cambodia:Khmer;Laos:Lao;Myanmar:Burmese;Mongolia:Mongolian;Ukraine:Ukrainian;Bangladesh:Bengali;Indonesia:Indonesian;Nepal:Nepali;Iceland:Icelandic;Colombia:Spanish;Chile:Spanish;Denmark:Danish;Czechia:Czech;Romania:Romanian;Cuba:Spanish",2),...rows("Georgia:Georgian;Armenia:Armenian;Azerbaijan:Azerbaijani;Uzbekistan:Uzbek;Turkmenistan:Turkmen;Albania:Albanian;Lithuania:Lithuanian;Latvia:Latvian;Estonia:Estonian;Slovakia:Slovak;Croatia:Croatian;Serbia:Serbian;Bulgaria:Bulgarian;Sweden:Swedish",3)];
const P=[];
CAP.forEach(r=>{P.push(["Capitals Challenge",r.d,`What is the capital of ${r.a}?`,r.b,dist(CAP,r,'b'),`${r.b} is the capital of ${r.a}.`,r.a,'c']);
if(!NOC.includes(r.a))P.push(["Which Continent?",r.d,`On which continent is ${r.a} located?`,RN[r.r],()=>shuf(CT.filter(c=>c!=RN[r.r])).slice(0,3),`${r.a} is in ${RN[r.r]}${r.r=='m'?' (in the Middle East)':''}; its capital is ${r.b}.`,r.a,'n'])});
CUR.forEach(r=>P.push(["Economics",r.d,`What is the official currency of ${r.a}?`,r.b,dist(CUR,r,'b'),`The official currency of ${r.a} is the ${r.b}.`,r.a,'u']));
LM.forEach(r=>P.push(["Landmark Challenge",r.d,`In which country is ${r.a} located?`,r.b,dist(CAP,{r:r.r,a:r.b},'a'),`${r.a} is in ${r.b}.`,r.a,'l']));
EL.forEach(r=>P.push(["Science Challenge",r.d,`Which chemical element has the symbol ${r.a}?`,r.b,dist(EL,r,'b'),`${r.a} is the chemical symbol for ${r.b}.`,r.a,'e']));
LG.forEach(r=>P.push(["Language",r.d,`Which language is the official language of ${r.a}?`,r.b,dist(LG,r,'b'),`${r.b} is the official language of ${r.a}.`,r.a,'g']));
const POOL=Q.concat(P);
const $=s=>document.querySelector(s),app=$('#app'),TIME=20,AUTO=5;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const PTS={1:100,2:200,3:300},LN={1:'Easy',2:'Medium',3:'Hard'};
const LV=[[96,'Ultimate Global Genius','Flawless! You know our planet inside out.'],[81,'World Expert','Outstanding! Few people know the world this well.'],[61,'Global Scholar','Great work! Your knowledge spans continents.'],[41,'Knowledge Seeker','Solid effort! Keep exploring and you will climb higher.'],[21,'Curious Traveler','Good start! Every journey begins with curiosity.'],[0,'World Explorer','The adventure has just begun, so play again and learn!']];
let hs=0;try{hs=+localStorage.getItem('wgk_hs')||0}catch(e){}
let G,tm,auto;
const globe='<svg class="globe" viewBox="0 0 100 100" fill="none" stroke="#2dd4bf" stroke-width="1.5" aria-hidden="true"><circle cx="50" cy="50" r="44"/><ellipse cx="50" cy="50" rx="18" ry="44"/><ellipse cx="50" cy="50" rx="36" ry="44" opacity=".5"/><path d="M6 50h88M12 28h76M12 72h76" opacity=".6"/></svg>';
function home(){clearInterval(tm);clearTimeout(auto);
app.innerHTML=`<section class="screen">${globe}<h1>WORLDWIDE GENERAL KNOWLEDGE</h1><p class="sub">How much do you know about our world?</p>
<div class="grid card"><div class="stat"><b>20</b><span>Questions</span></div><div class="stat"><b>${TIME}s</b><span>Per question</span></div><div class="stat"><b>${POOL.length}</b><span>Question bank</span></div><div class="stat"><b>${hs.toLocaleString()}</b><span>High Score</span></div></div>
<button class="btn pri" id="st">Start Quiz</button><button class="btn" id="hw">How to Play</button>
<div class="card" id="how" hidden><b>How to play</b><ul><li>Answer 20 questions from every region of the world.</li><li>You have ${TIME} seconds for each one. Answers lock when you pick or time runs out.</li><li>Special rounds (flags, capitals, landmarks, who am I and more) appear along the way.</li><li>Keys 1–4 or A–D also select answers.</li><li>Answer fast for a small time bonus (up to 50 points).</li></ul>
<b>Difficulty</b><ul><li><span class="d1">Easy</span>: 5 questions, 100 points</li><li><span class="d2">Medium</span>: 10 questions, 200 points</li><li><span class="d3">Hard</span>: 5 questions, 300 points</li></ul></div></section>`;
$('#st').onclick=start;$('#hw').onclick=()=>{const h=$('#how');h.hidden=!h.hidden}}
function start(){const used=new Set(),cnt={};
const by=(d,n)=>{const o=[];for(const q of shuf(POOL.filter(q=>q[1]==d))){if(o.length>=n)break;const g=q[7];if((q[6]&&used.has(q[6]))||(g&&(cnt[g]||0)>=3))continue;if(q[6])used.add(q[6]);if(g)cnt[g]=(cnt[g]||0)+1;o.push(q)}return o};
const sel=shuf([...by(1,5),...by(2,10),...by(3,5)]).map(q=>{const o=shuf([q[3],...(typeof q[4]=='function'?q[4]():q[4])]);return{tag:q[0],d:q[1],q:q[2],o,c:o.indexOf(q[3]),e:q[5]}});
G={qs:sel,i:0,score:0,ok:0,time:0,log:[]};show()}
function show(){clearTimeout(auto);const q=G.qs[G.i];G.lock=false;G.t0=Date.now();
app.innerHTML=`<section class="screen"><div class="hud"><span>Question ${G.i+1} / 20</span><span>Score: ${G.score.toLocaleString()} points</span><span id="tl">Time: ${TIME} seconds</span></div>
<div class="bar" aria-hidden="true"><i style="width:${G.i/20*100}%"></i></div><div class="bar tbar" aria-hidden="true"><i id="tb" style="width:100%;background:var(--ac)"></i></div>
<div class="card"><span class="tag">${q.tag}</span><span class="tag d${q.d}">${LN[q.d]} · ${PTS[q.d]} pts</span><p class="q" id="qq">${q.q}</p>
<div role="group" aria-labelledby="qq">${q.o.map((t,k)=>`<button class="opt" data-k="${k}"><span>${'ABCD'[k]}</span>${t}</button>`).join('')}</div>
<div id="fb" aria-live="polite"></div></div></section>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
clearInterval(tm);tm=setInterval(()=>{const l=TIME-(Date.now()-G.t0)/1000;if(l<=0){pick(-1);return}
$('#tb').style.width=l/TIME*100+'%';$('#tb').style.background=l<6?'var(--no)':l<11?'var(--go)':'var(--ac)';$('#tl').textContent='Time: '+Math.ceil(l)+' seconds'},100)}
function pick(k){if(G.lock)return;G.lock=true;clearInterval(tm);const q=G.qs[G.i],used=Math.min(TIME,(Date.now()-G.t0)/1000);G.time+=used;
const right=k==q.c;let pts=0;if(right){pts=PTS[q.d]+Math.round((TIME-used)/TIME*50);G.score+=pts;G.ok++}
G.log.push({q,k,pts});
document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j==q.c)b.classList.add('ok');else if(j==k)b.classList.add('no')});
if(k<0)$('#tl').textContent="Time's up!";
const last=G.i==19;
$('#fb').innerHTML=`<div class="fb ${right?'':'bad'}"><b>${right?'Correct! +'+pts+' points':k<0?"Time's up. The answer was "+q.o[q.c]:'Incorrect. The answer was '+q.o[q.c]}</b>${q.e}</div><button class="btn pri" id="nx">${last?'See Results':'Next Question'}</button>`;
$('#nx').focus();$('#nx').onclick=next;auto=setTimeout(next,AUTO*1000+(last?0:0))}
function next(){clearTimeout(auto);if(!G.lock)return;G.lock=false;G.i++;G.i>=20?end():show()}
function end(){const acc=Math.round(G.ok/20*100),L=LV.find(l=>acc>=l[0]),best=G.score>hs;
if(best){hs=G.score;try{localStorage.setItem('wgk_hs',hs)}catch(e){}}
const m=Math.floor(G.time/60),s=Math.round(G.time%60);
app.innerHTML=`<section class="screen"><h1>Quiz Complete</h1><div class="big">${G.score.toLocaleString()}</div><p class="sub">points${best?' · New High Score!':''}</p><div class="lvl">${L[1]}</div><p class="sub">${L[2]}</p>
<div class="grid card"><div class="stat"><b>${G.ok}</b><span>Correct</span></div><div class="stat"><b>${20-G.ok}</b><span>Incorrect</span></div><div class="stat"><b>${acc}%</b><span>Accuracy</span></div><div class="stat"><b>${m}:${String(s).padStart(2,'0')}</b><span>Total time</span></div></div>
<button class="btn pri" id="pa">Play Again</button><button class="btn" id="rv">Review Answers</button><button class="btn" id="sh">Share Score</button><button class="btn" id="hm">Return to Home</button><p class="sub" id="sm"></p></section>`;
$('#pa').onclick=start;$('#hm').onclick=home;$('#rv').onclick=review;
$('#sh').onclick=async()=>{const t=`I scored ${G.score.toLocaleString()} points (${acc}%) and earned "${L[1]}" in the Worldwide General Knowledge Quiz! Can you beat me?`;
try{if(navigator.share){await navigator.share({text:t});return}await navigator.clipboard.writeText(t);$('#sm').textContent='Score copied to clipboard!'}catch(e){$('#sm').textContent=t}}}
function review(){app.innerHTML=`<section class="screen"><h1>Review</h1>${G.log.map((r,n)=>{const q=r.q,ok=r.k==q.c;return`<div class="card rv ${ok?'':'bad'}"><small>${n+1}. ${q.tag} · ${LN[q.d]}</small><p><b>${q.q}</b></p><div>${ok?'✔':'✘'} Your answer: ${r.k<0?'No answer':q.o[r.k]}</div>${ok?'':`<div>✔ Correct: ${q.o[q.c]}</div>`}<small>${q.e}</small></div>`}).join('')}<button class="btn pri" id="bk">Back to Results</button></section>`;$('#bk').onclick=end}
document.addEventListener('keydown',e=>{if(!G||G.lock||!$('.opt'))return;const k='1234'.indexOf(e.key);const l='abcd'.indexOf(e.key.toLowerCase());const j=k>=0?k:l;if(j>=0&&e.key.length==1)pick(j)});
home();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
